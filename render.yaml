services:
  - type: web
    name: urban-issue-reporter
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: UPLOAD_FOLDER
        value: /data/uploads
      - key: DATABASE_PATH
        value: /data/urban_issues.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
